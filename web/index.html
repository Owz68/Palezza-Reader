<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palezza Reader</title>
<style>
:root{--n:#0b1f4b;--e:#2563eb;--bg:#fff;--s:#f1f4f9;--t:#0a0a0a;--m:#5b6577;--b:#e1e6ef;--g:#cfd6e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--s:#172036;--t:#f2f5fb;--m:#9aa6bd;--b:#26314a;--g:#0a0f1c}}
:root[data-theme="dark"]{--bg:#0e1424;--s:#172036;--t:#f2f5fb;--m:#9aa6bd;--b:#26314a;--g:#0a0f1c}
html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
#app{display:flex;height:100%}
nav{width:236px;background:var(--n);color:#fff;display:flex;flex-direction:column;padding:12px 8px;gap:2px;overflow:auto;flex:none}
.lg{display:flex;align-items:center;gap:10px;padding:6px 10px 14px;font-weight:700}.lg img{width:34px;height:34px;border-radius:8px}.lg small{display:block;font-weight:400;opacity:.7;font-size:11px}
nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;color:#cdd8f2}nav a i{font-style:normal;width:20px;text-align:center}
nav a:hover{background:#ffffff14}nav a.on{background:var(--e);color:#fff}
main{flex:1;overflow:auto;padding:22px;min-width:0}
h1{margin:0 0 4px;font-size:24px}h2{font-size:16px;margin:26px 0 10px}.mu,small{color:var(--m)}
.b{border:1px solid var(--b);background:var(--s);color:var(--t);padding:9px 14px;border-radius:9px;font:inherit;cursor:pointer}.b.p{background:var(--e);border-color:var(--e);color:#fff}.b:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{border:1px solid var(--b);border-radius:12px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.th{height:150px;background:var(--s);border-radius:8px;display:grid;place-items:center;cursor:pointer;overflow:hidden;color:var(--m);font-weight:700}.th img{width:100%;height:100%;object-fit:cover;object-position:top}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ac{display:flex;gap:4px}.ac button{flex:1;border:0;background:var(--s);color:var(--t);border-radius:6px;padding:5px;cursor:pointer}
select,input[type=search],input[type=text],input[type=password],input[type=number]{font:inherit;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);max-width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.tile{border:1px dashed var(--b);border-radius:10px;padding:12px;background:var(--s)}.tile b{display:block}.tag{font-size:11px;color:var(--e);font-weight:600}
.bar{height:8px;background:var(--s);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--e)}
.empty{border:2px dashed var(--b);border-radius:14px;padding:28px;text-align:center;color:var(--m)}
.chip{padding:6px 12px;border-radius:20px;background:var(--s);cursor:pointer;border:1px solid var(--b)}.chip.on{background:var(--e);color:#fff;border-color:var(--e)}
#rd{display:flex;flex-direction:column;height:100%}.rbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--n);color:#fff;padding:6px 8px}
.rbar button{background:#ffffff1a;border:0;color:#fff;border-radius:7px;min-width:34px;height:34px;font-size:16px;cursor:pointer}.rbar button.on{background:var(--e)}.rbar input{width:56px;text-align:center}
.rt{flex:1;min-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;padding:0 6px}
.rbody{flex:1;min-height:0;display:flex;position:relative}#panel{width:230px;background:var(--s);display:flex;flex-direction:column;flex:none;border-right:1px solid var(--b)}
.tabs{display:flex}.tabs button{flex:1;border:0;background:none;padding:9px 2px;color:var(--m);cursor:pointer;font:inherit;font-size:13px}.tabs button.on{color:var(--e);border-bottom:2px solid var(--e);font-weight:600}
.pn{flex:1;overflow:auto;padding:8px}.tm{text-align:center;margin-bottom:8px;cursor:pointer;border:2px solid transparent;border-radius:6px;padding:3px}.tm.on{border-color:var(--e)}.tm canvas{max-width:100%;box-shadow:0 1px 4px #0004}.tm i{display:block;font-size:12px;color:var(--m);font-style:normal}
.hit{padding:7px;border-radius:6px;cursor:pointer;font-size:13px}.hit:hover{background:var(--bg)}
#view{flex:1;overflow:auto;background:var(--g)}.pg{margin:12px auto;background:#fff;box-shadow:0 2px 10px #0005;display:flex;align-items:center;justify-content:center;color:#777}
.ov{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:50}.dlg{background:var(--bg);padding:18px;border-radius:12px;width:min(360px,90vw)}.dlg input{width:100%;box-sizing:border-box}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw}
#app.reading nav{display:none}#app.reading main{padding:0;overflow:hidden}
@media(max-width:800px){#app{flex-direction:column}nav{order:2;width:auto;flex-direction:row;padding:4px;overflow-x:auto}.lg{display:none}nav a{flex-direction:column;gap:0;font-size:11px;min-width:74px;text-align:center;padding:6px}main{order:1;padding:14px}#panel{position:absolute;z-index:5;height:100%;width:78%;box-shadow:2px 0 12px #0006}.toast{bottom:20px}}
</style></head><body>

function ask(msg,def,pw){return new Promise(ok=>{const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="dlg"><p>${esc(msg)}</p>${def===undefined?'':`<input type="${pw?'password':'text'}" value="${esc(def)}">`}<div class="row"><button class="b" data-r="0">Annuler</button><button class="b p" data-r="1">OK</button></div></div>`;document.body.append(o);const i=o.querySelector('input');if(i){i.focus();i.select();i.onkeydown=e=>{if(e.key==='Enter'){o.remove();ok(i.value)}}}o.onclick=e=>{const r=e.target.dataset.r;if(r){o.remove();ok(r==='0'?null:i?i.value:true)}}})}

const idb=new Promise((ok,ko)=>{const r=indexedDB.open('palezza-reader',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const dbop=async(m,f)=>{const d=await idb;return new Promise((ok,ko)=>{const t=d.transaction('docs',m),q=f(t.objectStore('docs'));t.oncomplete=()=>ok(q.result);t.onerror=()=>ko(t.error)})};
const put=d=>dbop('readwrite',s=>s.put(d)),del=id=>dbop('readwrite',s=>s.delete(id)),all=()=>dbop('readonly',s=>s.getAll());
const S={docs:[],folders:[],view:'dash',q:'',folder:null};
async function load(){const a=await all();S.docs=a.filter(x=>x.blob);S.folders=(a.find(x=>x.id==='__f')||{list:[]}).list}
const saveF=()=>put({id:'__f',list:S.folders});
async function thumb(p){const g=await p.getPage(1),s=220/g.getViewport({scale:1}).width,v=g.getViewport({scale:s}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await g.render({canvasContext:c.getContext('2d'),viewport:v}).promise;return c.toDataURL('image/jpeg',.7)}
async function imp(files){for(const f of files){try{
 if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf')throw'format non pris en charge (PDF uniquement)';
 if(f.size>157286400)throw'fichier trop volumineux (150 Mo max)';
 const buf=await f.arrayBuffer();if(new TextDecoder().decode(buf.slice(0,1024)).indexOf('%PDF')<0)throw'ce fichier n’est pas un vrai PDF';
 const d={id:crypto.randomUUID(),name:f.name,size:f.size,added:Date.now(),opened:0,fav:0,folder:null,page:1,marks:[],blob:new Blob([buf],{type:'application/pdf'})};
 try{const p=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;d.pages=p.numPages;d.thumb=await thumb(p);p.destroy()}catch(e){if(e.name==='PasswordException')d.enc=1;else throw'PDF illisible ou corrompu'}
 await put(d);S.docs.push(d);toast('Importé : '+f.name)}catch(e){toast(f.name+' — '+(e.message||e))}}
 if(S.view==='dash')S.view='docs';render()}
function dl(d){const a=document.createElement('a');a.href=URL.createObjectURL(d.blob);a.download=d.name;document.body.append(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},2000)}
/* ---- Vues ---- */
const NAV=[['dash','⌂','Tableau de bord'],['docs','▤','Mes documents'],['recent','◷','Fichiers récents'],['fav','★','Favoris'],['folders','▣','Mes dossiers'],['tools','✎','Outils PDF'],['scan','◫','Scanner'],['sign','✍','Signatures'],['set','⚙','Paramètres'],['acct','◉','Mon compte Palezza']];
const TOOLS=[['Annotations',2],['Organiser les pages',2],['Fusionner / séparer',2],['Images → PDF',2],['Compresser',2],['Signer',3],['Scanner & OCR',3],['Assistant IA',5]];
const tiles=n=>`<div class="tiles">${TOOLS.slice(0,n).map(t=>`<div class="tile"><b>${t[0]}</b><span class="tag">Phase ${t[1]} — pas encore disponible</span></div>`).join('')}</div>`;
const card=d=>`<div class="card" data-id="${d.id}"><div class="th" data-act="open">${d.thumb?`<img alt="" src="${d.thumb}">`:'PDF'}</div><b class="nm" title="${esc(d.name)}">${esc(d.name)}</b><small>${d.pages?d.pages+' p. · ':''}${fs(d.size)}${d.enc?' · protégé':''}</small><div class="ac"><button data-act="fav" title="Favori">${d.fav?'★':'☆'}</button><button data-act="ren" title="Renommer">✎</button><button data-act="dl" title="Télécharger">⇩</button><button data-act="rm" title="Supprimer">✕</button></div>${S.folders.length?`<select data-act="mv"><option value="">Sans dossier</option>${S.folders.map(f=>`<option value="${f.id}"${d.folder===f.id?' selected':''}>${esc(f.name)}</option>`).join('')}</select>`:''}</div>`;
const grid=(l,m)=>l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="empty">${m||'Aucun document pour le moment.'}</div>`;
const filt=l=>S.q?l.filter(d=>d.name.toLowerCase().includes(S.q.toLowerCase())):l;
const byRecent=()=>[...S.docs].filter(d=>d.opened).sort((a,b)=>b.opened-a.opened);
const V={
dash:()=>`<h1>Tableau de bord</h1><p class="mu">Vos documents restent sur cet appareil (mode hors ligne).</p>
<div class="row"><button class="b p" data-act="imp">Ouvrir un PDF</button><button class="b" disabled title="Phase 3">Scanner un document (phase 3)</button><button class="b" disabled title="Phase 2">Créer un PDF (phase 2)</button></div>
<h2>Récemment ouverts</h2>${grid(byRecent().slice(0,6),'Importez un PDF pour commencer.')}
<h2>Favoris</h2>${grid(S.docs.filter(d=>d.fav).slice(0,6),'Marquez un document avec ☆ pour le retrouver ici.')}
<h2>Outils PDF</h2>${tiles(4)}<h2>Stockage utilisé</h2><div id="stg"></div>`,
docs:()=>`<h1>Mes documents</h1><div class="row"><button class="b p" data-act="imp">＋ Importer des PDF</button><input type="search" id="q" placeholder="Rechercher un nom…" value="${esc(S.q)}"></div><div id="g">${grid(filt(S.docs),'Glissez des PDF ici ou utilisez « Importer ».')}</div>`,
recent:()=>`<h1>Fichiers récents</h1>${grid(byRecent(),'Aucun document ouvert récemment.')}`,
fav:()=>`<h1>Favoris</h1>${grid(S.docs.filter(d=>d.fav),'Aucun favori.')}`,
folders:()=>`<h1>Mes dossiers</h1><div class="row">${S.folders.map(f=>`<span class="chip${S.folder===f.id?' on':''}" data-act="pf" data-f="${f.id}">${esc(f.name)} (${S.docs.filter(d=>d.folder===f.id).length})</span>`).join('')}<button class="b" data-act="nf">＋ Nouveau dossier</button>${S.folder?'<button class="b" data-act="df">Supprimer ce dossier</button>':''}</div>${S.folder?grid(S.docs.filter(d=>d.folder===S.folder),'Dossier vide. Déplacez-y un document depuis « Mes documents ».'):'<div class="empty">Créez un dossier puis sélectionnez-le.</div>'}`,
tools:()=>`<h1>Outils PDF</h1><p class="mu">Ces outils arrivent dans les phases suivantes. Aucun n’est simulé : ils sont désactivés tant qu’ils ne fonctionnent pas réellement.</p>${tiles(8)}`,
scan:()=>`<h1>Scanner</h1><div class="empty">Caméra, recadrage, correction de perspective et OCR : prévus en phase 3. Non disponibles dans cette version.</div>`,
sign:()=>`<h1>Signatures</h1><div class="empty">Création, bibliothèque et insertion de signatures : prévues en phase 3. À noter : une signature visuelle n’est pas automatiquement une signature électronique certifiée.</div>`,
set:()=>`<h1>Paramètres</h1><h2>Affichage par défaut du lecteur</h2><select id="sm"><option value="cont"${pref()==='cont'?' selected':''}>Défilement continu</option><option value="single"${pref()==='single'?' selected':''}>Page par page</option></select><h2>Données locales</h2><p class="mu">Tous vos documents sont stockés dans ce navigateur.</p><button class="b" data-act="wipe">Supprimer toutes les données locales</button><h2>À propos</h2><p class="mu">Palezza Reader — Palezza Network · version Phase 1 · moteur PDF : PDF.js (Apache 2.0).</p>`,
acct:()=>`<h1>Mon compte Palezza</h1><div class="empty">Palezza ID, synchronisation cloud (Supabase / Cloudflare R2) et abonnements ne sont pas encore connectés (phases 4 et 5). Formule actuelle : usage local gratuit.</div>`,
read:()=>`<div id="rd"><div class="rbar"><button data-act="back" title="Retour">←</button><button data-act="panel" title="Panneau">☰</button><span class="rt" id="rtt"></span><button data-act="prev">‹</button><input type="number" id="pi" min="1"><span id="pn"></span><button data-act="next">›</button><button data-act="zout">−</button><span id="zl"></span><button data-act="zin">+</button><button data-act="fit" title="Largeur">⤢</button><button data-act="rot" title="Rotation">↻</button><button data-act="mode" id="bmo" title="Mode"></button><button data-act="bm" id="bmk" title="Marque-page">⚑</button><button data-act="fs" title="Plein écran">⛶</button><button data-act="rdl" title="Télécharger">⇩</button></div>
<div class="rbody"><div id="panel"><div class="tabs"><button data-tab="th" class="on">Pages</button><button data-tab="bk">Signets</button><button data-tab="sr">Recherche</button></div><div class="pn" id="t_th"></div><div class="pn" id="t_bk" hidden></div><div class="pn" id="t_sr" hidden><input type="search" id="sq" placeholder="Rechercher…" style="width:100%;box-sizing:border-box"><div id="sres"></div></div></div><div id="view"><div id="pages"></div></div></div></div>`};
function render(){$('#app').classList.toggle('reading',S.view==='read');$('#nav').innerHTML=`<div class="lg"><img alt="" src="${LOGO}"><div>Palezza Reader<small>Palezza Network</small></div></div>`+NAV.map(([k,i,l])=>`<a data-v="${k}" class="${S.view===k?'on':''}"><i>${i}</i><span>${l}</span></a>`).join('');$('#main').innerHTML=V[S.view]();if(S.view==='dash')stor()}
async function stor(){const e=$('#stg');if(!e)return;const u=S.docs.reduce((a,d)=>a+d.size,0);let q=0;try{q=(await navigator.storage.estimate()).quota||0}catch{}e.innerHTML=`<div class="bar"><i style="width:${q?Math.min(100,u/q*100):0}%"></i></div><small>${fs(u)} de documents${q?' · '+fs(q)+' disponibles sur cet appareil':''}</small>`}
/* ---- Lecteur ---- */
const R={};
async function openDoc(id){const d=S.docs.find(x=>x.id===id);if(!d)return;try{
 const buf=await d.blob.arrayBuffer(),task=pdfjsLib.getDocument({data:new Uint8Array(buf)});
 task.onPassword=async(cb,r)=>{const p=await ask(r===2?'Mot de passe incorrect. Réessayez :':'Ce PDF est protégé. Mot de passe :','',1);p===null?task.destroy():cb(p)};
 const pdf=await task.promise;d.opened=Date.now();d.pages=pdf.numPages;put(d);
 Object.assign(R,{d,pdf,n:pdf.numPages,page:Math.min(d.page||1,pdf.numPages),rot:0,mode:pref(),sid:0});
 S.view='read';render();await startReader()}catch(e){toast('Ouverture impossible : '+(e.message||e))}}
async function startReader(){$('#rtt').textContent=R.d.name;if(innerWidth<800)$('#panel').hidden=true;const p1=await R.pdf.getPage(1);R.base=p1.getViewport({scale:1});fitW(1);await layout();thumbs();bmList()}
function fitW(cap){const w=$('#view').clientWidth-24,ww=R.rot%180?R.base.height:R.base.width,s=w/ww;R.scale=Math.max(.2,Math.min(cap?1.5:4,s))}
async function layout(){const v=$('#pages');R.io&&R.io.disconnect();v.innerHTML='';const ids=R.mode==='single'?[R.page]:Array.from({length:R.n},(_,i)=>i+1),sw=R.rot%180,bw=(sw?R.base.height:R.base.width)*R.scale,bh=(sw?R.base.width:R.base.height)*R.scale;
 R.io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&rp(e.target)),{root:$('#view'),rootMargin:'800px 0px'});
 for(const i of ids){const el=document.createElement('div');el.className='pg';el.dataset.n=i;el.style.width=bw+'px';el.style.height=bh+'px';v.append(el);R.io.observe(el)}
 if(R.mode!=='single')goPage(R.page);ui()}
async function rp(el){const key=R.scale+'|'+R.rot;if(el._k===key)return;el._k=key;const pg=await R.pdf.getPage(+el.dataset.n),vp=pg.getViewport({scale:R.scale,rotation:(pg.rotate+R.rot)%360}),dpr=Math.min(devicePixelRatio||1,2),c=document.createElement('canvas');c.width=vp.width*dpr;c.height=vp.height*dpr;c.style.width=vp.width+'px';c.style.height=vp.height+'px';el.style.width=vp.width+'px';el.style.height=vp.height+'px';
 try{await pg.render({canvasContext:c.getContext('2d'),viewport:vp,transform:dpr!=1?[dpr,0,0,dpr,0,0]:null}).promise;if(el._k===key)el.replaceChildren(c)}catch(e){el.textContent='Erreur de rendu de la page'}}
function goPage(n){n=Math.max(1,Math.min(R.n,Math.round(+n)||1));R.page=n;if(R.mode==='single')layout();else{const el=$('#pages').children[n-1];el&&el.scrollIntoView({block:'start'})}ui();sv()}
function sv(){clearTimeout(R.t);R.t=setTimeout(()=>{R.d.page=R.page;put(R.d)},600)}
function ui(){if(!$('#pi'))return;$('#pi').value=R.page;$('#pn').textContent='/ '+R.n;$('#zl').textContent=Math.round(R.scale*100)+'%';$('#bmo').textContent=R.mode==='single'?'▭':'▥';$('#bmk').classList.toggle('on',R.d.marks.some(m=>m.page===R.page));document.querySelectorAll('.tm').forEach(t=>t.classList.toggle('on',+t.dataset.n===R.page))}
function zoom(f){R.scale=Math.max(.2,Math.min(4,R.scale*f));layout()}
function thumbs(){const p=$('#t_th');p.innerHTML='';const io=new IntersectionObserver(es=>es.forEach(async e=>{if(!e.isIntersecting||e.target._d)return;e.target._d=1;const pg=await R.pdf.getPage(+e.target.dataset.n),s=110/pg.getViewport({scale:1}).width,v=pg.getViewport({scale:s}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;e.target.prepend(c);e.target.style.minHeight=''}),{root:p});
 for(let i=1;i<=R.n;i++){const d=document.createElement('div');d.className='tm';d.dataset.n=i;d.style.minHeight='150px';d.innerHTML='<i>'+i+'</i>';p.append(d);io.observe(d)}ui()}
function bmList(){$('#t_bk').innerHTML=R.d.marks.length?R.d.marks.sort((a,b)=>a.page-b.page).map(m=>`<div class="hit" data-p="${m.page}">⚑ Page ${m.page}</div>`).join(''):'<p class="mu">Aucun marque-page. Utilisez ⚑ dans la barre.</p>'}
async function search(q){q=q.trim().toLowerCase();const id=++R.sid,out=$('#sres');if(!q){out.innerHTML='';return}out.innerHTML='<p class="mu">Recherche…</p>';const hits=[];let txt=0;
 for(let i=1;i<=R.n&&hits.length<200;i++){if(id!==R.sid)return;const tc=await (await R.pdf.getPage(i)).getTextContent(),s=tc.items.map(x=>x.str).join(' '),l=s.toLowerCase();txt+=s.trim().length;let k=l.indexOf(q);while(k>=0&&hits.length<200){hits.push([i,s.slice(Math.max(0,k-25),k+q.length+35)]);k=l.indexOf(q,k+q.length)}}
 out.innerHTML=hits.length?hits.map(h=>`<div class="hit" data-p="${h[0]}"><b>p. ${h[0]}</b> ${esc(h[1])}</div>`).join(''):`<p class="mu">${txt?'Aucun résultat.':'Aucun texte détecté : PDF probablement numérisé (OCR prévu en phase 3).'}</p>`}
function leave(){try{R.pdf&&R.pdf.destroy()}catch{}document.fullscreenElement&&document.exitFullscreen();S.view='docs';render()}
/* ---- Événements ---- */
document.addEventListener('click',async e=>{
 const v=e.target.closest('[data-v]');if(v){S.view=v.dataset.v;S.q='';render();return}
 const t=e.target.closest('[data-tab]');if(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===t));['th','bk','sr'].forEach(k=>$('#t_'+k).hidden=k!==t.dataset.tab);return}
 const h=e.target.closest('.hit');if(h){goPage(h.dataset.p);if(innerWidth<800)$('#panel').hidden=true;return}
 const tm=e.target.closest('.tm');if(tm){goPage(tm.dataset.n);if(innerWidth<800)$('#panel').hidden=true;return}
 const a=e.target.closest('[data-act]');if(!a||a.tagName==='SELECT')return;const act=a.dataset.act,c=a.closest('.card'),d=c&&S.docs.find(x=>x.id===c.dataset.id);
 const A={imp:()=>$('#fi').click(),open:()=>openDoc(d.id),
 fav:async()=>{d.fav=d.fav?0:1;await put(d);render()},
 ren:async()=>{const n=await ask('Nouveau nom :',d.name);if(n&&n.trim()){d.name=n.trim();await put(d);render()}},
 dl:()=>dl(d),rm:async()=>{if(await ask('Supprimer « '+d.name+' » ?')){await del(d.id);S.docs=S.docs.filter(x=>x!==d);render()}},
 nf:async()=>{const n=await ask('Nom du dossier :','');if(n&&n.trim()){const f={id:crypto.randomUUID(),name:n.trim()};S.folders.push(f);S.folder=f.id;await saveF();render()}},
 pf:()=>{S.folder=a.dataset.f;render()},
 df:async()=>{if(await ask('Supprimer ce dossier ? Les documents sont conservés.')){S.docs.forEach(x=>{if(x.folder===S.folder){x.folder=null;put(x)}});S.folders=S.folders.filter(f=>f.id!==S.folder);S.folder=null;await saveF();render()}},
 wipe:async()=>{if(await ask('Supprimer TOUS les documents locaux ? Action irréversible.')){for(const x of S.docs)await del(x.id);S.docs=[];S.folders=[];await saveF();toast('Données locales supprimées');render()}},
 back:leave,panel:()=>{$('#panel').hidden=!$('#panel').hidden},prev:()=>goPage(R.page-1),next:()=>goPage(R.page+1),zin:()=>zoom(1.2),zout:()=>zoom(1/1.2),
 fit:()=>{fitW(0);layout()},rot:()=>{R.rot=(R.rot+90)%360;fitW(1);layout()},
 mode:()=>{R.mode=R.mode==='single'?'cont':'single';layout()},
 bm:async()=>{const i=R.d.marks.findIndex(m=>m.page===R.page);i>=0?R.d.marks.splice(i,1):R.d.marks.push({page:R.page});await put(R.d);bmList();ui()},
 fs:()=>{document.fullscreenElement?document.exitFullscreen():$('#rd').requestFullscreen?.().catch(()=>toast('Plein écran indisponible ici'))},
 rdl:()=>dl(R.d)};A[act]&&A[act]()});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='fi'){imp([...t.files]);t.value=''}
 else if(t.id==='pi')goPage(t.value)
 else if(t.id==='sm'){try{localStorage.pr_mode=t.value}catch{}}
 else if(t.dataset.act==='mv'){const d=S.docs.find(x=>x.id===t.closest('.card').dataset.id);d.folder=t.value||null;await put(d);render();toast('Document déplacé')}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#g').innerHTML=grid(filt(S.docs),'Aucun résultat.')}});
document.addEventListener('keydown',e=>{if(e.target.id==='sq'&&e.key==='Enter'){search(e.target.value);return}if(S.view!=='read'||e.target.tagName==='INPUT')return;
 if(e.key==='ArrowRight'||e.key==='PageDown'&&R.mode==='single')goPage(R.page+1);else if(e.key==='ArrowLeft'||e.key==='PageUp'&&R.mode==='single')goPage(R.page-1);else if(e.key==='+'||e.key==='=')zoom(1.2);else if(e.key==='-')zoom(1/1.2)});
document.addEventListener('scroll',e=>{if(e.target.id!=='view'||R.mode==='single'||R.raf)return;R.raf=requestAnimationFrame(()=>{R.raf=0;const vw=$('#view'),tp=vw.getBoundingClientRect().top+vw.clientHeight/3;let cur=1;for(const el of $('#pages').children){if(el.getBoundingClientRect().top<=tp)cur=+el.dataset.n;else break}if(cur!==R.page){R.page=cur;ui();sv()}})},true);
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();if(S.view!=='read'&&e.dataTransfer.files.length)imp([...e.dataTransfer.files])});
load().then(render).catch(()=>{render();toast('Stockage local indisponible : les documents ne seront pas conservés')});
</script></body></html>
